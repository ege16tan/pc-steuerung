name: Checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sensible Daten prüfen
        run: bash scripts/check-sensitive.sh
      - name: Python-Syntax prüfen
        run: python3 -m py_compile "PC App/main.py"
