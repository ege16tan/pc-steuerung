name: Checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sensible Daten prüfen
        run: bash scripts/check-sensitive.sh

  # Rust-Agent: bauen und Unit-/Integrationstests (HTTP-Endpunkte gegen die EXE).
  # Android wird hier bewusst nicht gebaut (zu schwer fuer CI).
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PC Agent Rust
    steps:
      - uses: actions/checkout@v4
      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable
      - name: Bauen (debug)
        run: cargo build
      - name: Tests
        run: cargo test
